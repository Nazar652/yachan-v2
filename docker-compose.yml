x-app-env: &app-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yachan}:${POSTGRES_PASSWORD:-yachan}@postgres:5432/${POSTGRES_DB:-yachan}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
  IP_HASH_SALT: ${IP_HASH_SALT:-dev-ip-salt-change-me}

services:
  postgres:
    image: postgres:17-alpine
    container_name: yachan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yachan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yachan}
      POSTGRES_DB: ${POSTGRES_DB:-yachan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yachan}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yachan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # one-shot: bring the schema up to head before anything that touches the db.
  # backend/celery wait for this to finish via service_completed_successfully.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yachan-migrate
    command: alembic upgrade head
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yachan-backend
    environment:
      <<: *app-env
    volumes:
      - media_data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yachan-celery-worker
    command: celery -A src.celery_app.celery worker --loglevel=info
    environment:
      <<: *app-env
    volumes:
      - media_data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yachan-celery-beat
    command: celery -A src.celery_app.celery beat --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # builds the SPA and serves it; also reverse-proxies /api (+ ws) to the backend
  # and /media from the shared storage volume.
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yachan-nginx
    volumes:
      - media_data:/media:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
