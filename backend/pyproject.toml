[project]
name = "yachan-v2"
version = "0.1.0"
description = ""
authors = [
    {name = "Nazariy Tymchyshyn",email = "nazariytymchyshyn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "kink (>=0.9.0,<0.10.0) ; python_version >= \"3.14\" and python_version < \"4.0\"",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy[asyncio] (>=2.0.50,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "mistune (>=3.2.1,<4.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "sentry-sdk (>=2.62.0,<3.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "onnxruntime (>=1.27.0,<2.0.0)",
    "tokenizers (>=0.23.1,<0.24.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "prometheus-fastapi-instrumentator (>=8.0.2,<9.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
prek = "^0.3.8"
pyright = "^1.1.409"
ruff = "^0.15.14"
pytest-asyncio = "^1.4.0"
types-aioboto3 = {extras = ["s3"], version = "^15.5.0"}

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
