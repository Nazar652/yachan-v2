name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install backend dependencies
        run: poetry -C backend install --no-interaction --no-root

      - name: Run backend linters
        run: |
          poetry -C backend run ruff check --force-exclude src/
          poetry -C backend run pyright

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install backend dependencies
        run: poetry -C backend install --no-interaction --no-root

      - name: Run backend tests
        env:
          JWT_SECRET: test-jwt-secret-change-me-in-ci
          IP_HASH_SALT: test-salt
        run: poetry -C backend run pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:unit -- --run

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint and type-check
        run: |
          npm run lint
          npm run type-check

  moderation-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moderation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install moderation dependencies
        run: poetry install --no-interaction

      - name: Run moderation linters
        run: |
          poetry run ruff check moderation
          poetry run pyright

  moderation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moderation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install moderation dependencies
        run: poetry install --no-interaction

      - name: Run moderation tests
        run: poetry run pytest tests/
