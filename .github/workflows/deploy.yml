name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/nazar652

jobs:
  build-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/yachan-backend:latest
            ${{ env.IMAGE_PREFIX }}/yachan-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push moderation
        uses: docker/build-push-action@v6
        with:
          context: ./moderation
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/yachan-moderation:latest
            ${{ env.IMAGE_PREFIX }}/yachan-moderation:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx (prod config)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NGINX_CONF=nginx.prod.conf
            VITE_SENTRY_DSN=${{ secrets.FRONTEND_SENTRY_DSN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/yachan-nginx:latest
            ${{ env.IMAGE_PREFIX }}/yachan-nginx:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.BACKEND_SENTRY_DSN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          STORAGE_BASE_URL: ${{ secrets.STORAGE_BASE_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: IMAGE_SHA,DATABASE_URL,JWT_SECRET,IP_HASH_SALT,S3_ACCESS_KEY,S3_SECRET_KEY,GEMINI_API_KEY,SENTRY_DSN,S3_BUCKET,S3_ENDPOINT_URL,STORAGE_BASE_URL,CORS_ORIGINS
          script: |
            set -e
            cd ~/yachan-v2
            git fetch origin master
            git reset --hard "${IMAGE_SHA}"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # namespace + app secret from GitHub Secrets (idempotent create-or-update).
            # yachan-tls (Cloudflare origin cert) is created once by hand — see k8s/README.md.
            kubectl create namespace yachan --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic yachan-secret -n yachan \
              --from-literal=DATABASE_URL="$DATABASE_URL" \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --from-literal=IP_HASH_SALT="$IP_HASH_SALT" \
              --from-literal=S3_ACCESS_KEY="$S3_ACCESS_KEY" \
              --from-literal=S3_SECRET_KEY="$S3_SECRET_KEY" \
              --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
              --from-literal=SENTRY_DSN="$SENTRY_DSN" \
              --from-literal=S3_BUCKET="$S3_BUCKET" \
              --from-literal=S3_ENDPOINT_URL="$S3_ENDPOINT_URL" \
              --from-literal=STORAGE_BASE_URL="$STORAGE_BASE_URL" \
              --from-literal=CORS_ORIGINS="$CORS_ORIGINS" \
              --dry-run=client -o yaml | kubectl apply -f -

            # pin all image refs to this commit (immutable, rollback-able)
            ( cd k8s/migrate && kustomize edit set image \
                yachan-backend=ghcr.io/nazar652/yachan-backend:${IMAGE_SHA} )
            ( cd k8s/overlays/prod && kustomize edit set image \
                yachan-backend=ghcr.io/nazar652/yachan-backend:${IMAGE_SHA} \
                yachan-nginx=ghcr.io/nazar652/yachan-nginx:${IMAGE_SHA} )
            ( cd k8s/moderation && kustomize edit set image \
                yachan-moderation=ghcr.io/nazar652/yachan-moderation:${IMAGE_SHA} )

            # 1. migrations as a discrete step — WAIT for them before touching the app,
            #    so the new code never rolls against an un-upgraded schema (no per-pod
            #    wait loop). migrate is a Job (immutable spec) — recreate it each deploy.
            kubectl -n yachan delete job migrate --ignore-not-found
            kubectl apply -k k8s/migrate
            kubectl -n yachan wait --for=condition=complete job/migrate --timeout=300s

            # 2. only now roll the app + moderation
            kubectl apply -k k8s/overlays/prod
            kubectl apply -k k8s/moderation
            kubectl -n yachan rollout status deploy/backend --timeout=180s
            kubectl -n yachan rollout status deploy/celery-worker --timeout=180s
            kubectl -n yachan rollout status deploy/celery-beat --timeout=120s
            kubectl -n yachan rollout status deploy/nginx --timeout=120s
            kubectl -n moderation rollout status deploy/moderation-worker --timeout=180s
