server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # rest api + websocket endpoints -> fastapi backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket upgrade (/api/{slug}/ws and /api/{slug}/threads/{id}/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # uploaded files live in the minio bucket; proxy public urls to it
    # (the bucket is anonymously readable, see the createbucket compose service)
    location /media/ {
        proxy_pass http://minio:9000/yachan-media/;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
    }

    # hashed build assets are content-addressed, so cache them aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # single-page app: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
