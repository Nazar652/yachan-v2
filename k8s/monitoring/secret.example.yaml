# Template for the two Grafana Cloud destination Secrets (namespace: monitoring),
# read by the Alloy collectors in generated/k8s-monitoring.yaml. Documentation only —
# NOT applied by kustomize (not listed in kustomization.yaml resources). deploy.yml
# generates these idempotently from the GitHub Secret GRAFANA_CLOUD_TOKEN on every
# deploy, same pattern as yachan-secret:
#   kubectl create secret generic grafana-cloud-logs-grafana-k8s-monitoring -n monitoring \
#     --from-literal=username=1671125 --from-literal=password=CHANGE-ME
#   kubectl create secret generic grafana-cloud-metrics-grafana-k8s-monitoring -n monitoring \
#     --from-literal=username=3350900 --from-literal=password=CHANGE-ME
# username is the numeric Grafana Cloud stack instance id (not secret, safe to read here);
# password is the access policy token (metrics:read + set:alloy-data-write) — never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-logs-grafana-k8s-monitoring
  namespace: monitoring
type: Opaque
stringData:
  username: "1671125"
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-metrics-grafana-k8s-monitoring
  namespace: monitoring
type: Opaque
stringData:
  username: "3350900"
  password: change-me
