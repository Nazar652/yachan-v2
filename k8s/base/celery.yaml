apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: yachan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: yachan-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - src.celery_app.celery
            - worker
            - -Q
            - celery,moderation_results
            - --concurrency=1
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: yachan-config
            - secretRef:
                name: yachan-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: yachan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: yachan-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - src.celery_app.celery
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: yachan-config
            - secretRef:
                name: yachan-secret
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
