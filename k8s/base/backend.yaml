apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: yachan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "8000"
        k8s.grafana.com/metrics.path: "/metrics"
    spec:
      containers:
        - name: backend
          image: yachan-backend:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: yachan-config
            - secretRef:
                name: yachan-secret
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: yachan
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
