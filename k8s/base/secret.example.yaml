# Template for the yachan Secret (namespace: yachan). Documentation only — NOT applied
# by kustomize (it is not listed in any kustomization resources). The dev overlay ships
# literal dev values inline; in prod inject these out-of-band and never commit real values:
#   kubectl create secret generic yachan-secret -n yachan --from-env-file=prod-secret.env
apiVersion: v1
kind: Secret
metadata:
  name: yachan-secret
  namespace: yachan
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://USER:PASSWORD@HOST:5432/DB   # prod: Neon url, append ?ssl=require
  JWT_SECRET: change-me-at-least-32-bytes-long
  IP_HASH_SALT: change-me
  S3_ACCESS_KEY: change-me
  S3_SECRET_KEY: change-me
  GEMINI_API_KEY: ""                                             # empty disables auto-summary
  SENTRY_DSN: ""                                                 # optional; empty disables Sentry
