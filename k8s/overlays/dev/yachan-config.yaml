apiVersion: v1
kind: ConfigMap
metadata:
  name: yachan-config
  namespace: yachan
data:
  PYTHONUNBUFFERED: "1"
  REDIS_URL: redis://redis:6379/0
  MEDIA_INTERNAL_URL: http://minio:9000/yachan-media
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: yachan-media
---
apiVersion: v1
kind: Secret
metadata:
  name: yachan-secret
  namespace: yachan
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://yachan:yachan@postgres:5432/yachan
  JWT_SECRET: dev-jwt-secret-change-me-0123456789-abcdef
  IP_HASH_SALT: dev-ip-salt-change-me
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  GEMINI_API_KEY: ""
