# Non-secret prod env. Secret values (DATABASE_URL, JWT_SECRET, IP_HASH_SALT,
# S3_ACCESS_KEY, S3_SECRET_KEY, GEMINI_API_KEY, SENTRY_DSN) are injected out-of-band
# as the yachan-secret (see base/secret.example.yaml) — never committed here.
# MEDIA_INTERNAL_URL is intentionally unset in prod: media is served from R2's public
# url, so yachan builds the moderation image_url from the public bucket url instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yachan-config
  namespace: yachan
data:
  PYTHONUNBUFFERED: "1"
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_REGION: auto
  SENTRY_ENVIRONMENT: production
  S3_BUCKET: REPLACE_WITH_R2_BUCKET
  S3_ENDPOINT_URL: REPLACE_WITH_R2_ENDPOINT
  STORAGE_BASE_URL: REPLACE_WITH_PUBLIC_R2_URL
  CORS_ORIGINS: REPLACE_WITH_PROD_ORIGIN
