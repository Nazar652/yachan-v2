# Cloudflare Origin Certificate for the prod nginx edge (mounted at /etc/nginx/ssl,
# referenced by nginx.prod.conf as origin.pem / origin.key). NOT committed with real
# values — create it out-of-band on the server from the cert/key you generate in the
# Cloudflare dashboard (SSL/TLS -> Origin Server -> Create Certificate):
#
#   kubectl create secret generic yachan-tls -n yachan \
#     --from-file=origin.pem=./origin.pem \
#     --from-file=origin.key=./origin.key
#
apiVersion: v1
kind: Secret
metadata:
  name: yachan-tls
  namespace: yachan
type: Opaque
stringData:
  origin.pem: REPLACE_WITH_CLOUDFLARE_ORIGIN_CERT_PEM
  origin.key: REPLACE_WITH_CLOUDFLARE_ORIGIN_KEY
