x-prod-app-env: &prod-app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Neon connection string}
  DB_USE_NULL_POOL: "true"
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL to the R2 endpoint}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY to the R2 access key}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY to the R2 secret key}
  S3_REGION: ${S3_REGION:-auto}
  STORAGE_BASE_URL: ${STORAGE_BASE_URL:?set STORAGE_BASE_URL to the public R2 url}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the production origin}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

services:
  redis:
    ports: !override []

  migrate:
    environment:
      <<: *prod-app-env
    depends_on: !reset null

  backend:
    environment:
      <<: *prod-app-env
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker:
    environment:
      <<: *prod-app-env
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    environment:
      <<: *prod-app-env

  nginx:
    build:
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
    ports: !override
      - "80:80"
      - "443:443"
    depends_on: !override
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
